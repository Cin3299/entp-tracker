<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日打卡">
<meta name="theme-color" content="#7F77DD">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>每日打卡</title>
<style>
  :root {
    --purple: #7F77DD;
    --purple-light: #EEEDFE;
    --purple-dark: #3C3489;
    --purple-mid: #534AB7;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --teal-dark: #085041;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --green: #639922;
    --green-light: #EAF3DE;
    --green-dark: #27500A;
    --gray-bg: #f5f5f7;
    --gray-card: #ffffff;
    --gray-border: rgba(0,0,0,0.1);
    --text: #1a1a1a;
    --text-sub: #666;
    --text-hint: #999;
    --radius: 16px;
    --radius-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --gray-bg: #111;
      --gray-card: #1e1e1e;
      --gray-border: rgba(255,255,255,0.1);
      --text: #f0f0f0;
      --text-sub: #aaa;
      --text-hint: #666;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .topbar {
    background: var(--purple);
    color: white;
    padding: 16px 20px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 20px; font-weight: 600; }
  .topbar .date { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .notif-btn {
    background: rgba(255,255,255,0.2);
    border: none; border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; color: white;
    position: relative;
  }
  .notif-dot {
    position: absolute; top: 6px; right: 6px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #FF3B30; border: 1.5px solid var(--purple);
    display: none;
  }
  .notif-dot.show { display: block; }
  .content { padding: 16px; max-width: 480px; margin: 0 auto; }
  .streak-card {
    background: var(--purple-light);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 16px;
  }
  .streak-num { font-size: 40px; font-weight: 700; color: var(--purple-dark); line-height: 1; }
  .streak-label { font-size: 15px; font-weight: 600; color: var(--purple-dark); }
  .streak-sub { font-size: 12px; color: var(--purple-mid); margin-top: 2px; }
  .section-label {
    font-size: 12px; font-weight: 600; color: var(--text-hint);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin: 20px 0 10px;
  }
  .tasks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .task-card {
    background: var(--gray-card);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    active-scale: 0.97;
  }
  .task-card:active { transform: scale(0.97); }
  .task-card.done { background: var(--teal-light); border-color: var(--teal); }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .task-emoji { font-size: 22px; }
  .check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--gray-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: white; flex-shrink: 0;
  }
  .task-card.done .check { background: var(--teal); border-color: var(--teal); }
  .task-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .task-card.done .task-name { color: var(--teal-dark); }
  .task-min { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .task-card.done .task-min { color: var(--teal); }
  .prog-card {
    background: var(--gray-card);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-top: 12px;
  }
  .prog-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .prog-pct { color: var(--purple); }
  .prog-bg { background: var(--gray-bg); border-radius: 99px; height: 10px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--purple); border-radius: 99px; transition: width 0.4s ease; }
  .milestone-row { display: flex; flex-direction: column; gap: 10px; }
  .m-card {
    background: var(--gray-card);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .m-icon { font-size: 24px; flex-shrink: 0; }
  .m-info { flex: 1; }
  .m-label { font-size: 12px; color: var(--text-hint); }
  .m-val { font-size: 18px; font-weight: 700; }
  .m-target { font-size: 11px; color: var(--text-hint); }
  .m-bar-bg { background: var(--gray-bg); border-radius: 99px; height: 5px; margin-top: 6px; overflow: hidden; }
  .m-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .heatmap-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
  .h-cell {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--gray-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: var(--text-hint);
  }
  .h-cell.l1 { background: #CECBF6; }
  .h-cell.l2 { background: #AFA9EC; }
  .h-cell.l3 { background: #7F77DD; }
  .h-cell.l4 { background: #534AB7; }
  .quote-card {
    background: var(--purple);
    border-radius: var(--radius);
    padding: 16px 20px;
    color: white;
    font-size: 14px;
    line-height: 1.6;
    margin-top: 4px;
  }
  .notif-panel {
    background: var(--gray-card);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: none;
  }
  .notif-panel.open { display: block; }
  .notif-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .notif-title { font-size: 15px; font-weight: 600; }
  .toggle-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sub); }
  .toggle {
    width: 44px; height: 26px; border-radius: 13px;
    background: var(--gray-bg); border: none; cursor: pointer;
    position: relative; transition: background 0.2s;
  }
  .toggle.on { background: var(--purple); }
  .toggle::after {
    content: ''; position: absolute;
    width: 20px; height: 20px; border-radius: 50%;
    background: white; top: 3px; left: 3px;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(18px); }
  .time-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .time-row label { font-size: 13px; color: var(--text-sub); flex: 1; }
  .time-row input[type=time] {
    font-size: 15px; font-weight: 500;
    border: 1.5px solid var(--gray-border);
    border-radius: 8px; padding: 6px 10px;
    background: var(--gray-bg); color: var(--text);
  }
  .save-btn {
    width: 100%; margin-top: 12px;
    background: var(--purple); color: white;
    border: none; border-radius: var(--radius-sm);
    padding: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .save-btn:active { opacity: 0.8; }
  .update-ms-btn {
    width: 100%; margin-top: 8px;
    background: transparent; color: var(--purple);
    border: 1.5px solid var(--purple);
    border-radius: var(--radius-sm);
    padding: 11px; font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  .ms-inputs { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .ms-input-row { display: flex; align-items: center; gap: 10px; }
  .ms-input-row label { font-size: 13px; color: var(--text-sub); flex: 1; }
  .ms-input-row input {
    width: 80px; font-size: 15px; font-weight: 500;
    border: 1.5px solid var(--gray-border);
    border-radius: 8px; padding: 6px 10px;
    background: var(--gray-bg); color: var(--text); text-align: right;
  }
  .reset-link { display: block; text-align: center; font-size: 12px; color: var(--text-hint); margin-top: 20px; padding-bottom: 8px; cursor: pointer; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <h1>每日打卡</h1>
      <div class="date" id="date-label"></div>
    </div>
    <button class="notif-btn" id="notif-btn" onclick="toggleNotifPanel()" title="提醒設定">
      🔔
      <div class="notif-dot" id="notif-dot"></div>
    </button>
  </div>
</div>

<div class="content">

  <div id="notif-panel" class="notif-panel">
    <div class="notif-row">
      <div class="notif-title">每日提醒</div>
    </div>
    <div class="toggle-wrap">
      <button class="toggle" id="notif-toggle" onclick="toggleNotif()"></button>
      <span id="notif-status">已關閉</span>
    </div>
    <div class="time-row">
      <label>提醒時間</label>
      <input type="time" id="notif-time" value="20:00">
    </div>
    <button class="save-btn" onclick="saveNotif()">儲存提醒設定</button>

    <div style="margin-top:20px; border-top:1px solid var(--gray-border); padding-top:16px;">
      <div class="notif-title" style="margin-bottom:12px;">更新里程碑</div>
      <div class="ms-inputs">
        <div class="ms-input-row"><label>多益分數</label><input type="number" id="ms-toeic" min="0" max="990"></div>
        <div class="ms-input-row"><label>TOPIK 級數</label><input type="number" id="ms-topik" min="1" max="6"></div>
        <div class="ms-input-row"><label>企劃書（份）</label><input type="number" id="ms-port" min="0" max="99"></div>
      </div>
      <button class="save-btn" style="margin-top:12px;" onclick="saveMilestones()">更新里程碑</button>
    </div>
  </div>

  <div class="streak-card">
    <div class="streak-num" id="streak-num">0</div>
    <div>
      <div class="streak-label" id="streak-label">連續天數</div>
      <div class="streak-sub" id="streak-sub">完成3項後開始累積</div>
    </div>
  </div>

  <div class="section-label">今日任務</div>
  <div class="tasks-grid" id="tasks-grid"></div>

  <div class="prog-card">
    <div class="prog-row">
      <span>今日完成度</span>
      <span class="prog-pct" id="prog-pct">0%</span>
    </div>
    <div class="prog-bg"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div class="section-label">里程碑</div>
  <div class="milestone-row" id="milestone-row"></div>

  <div class="section-label">本月紀錄</div>
  <div class="heatmap-wrap" id="heatmap"></div>

  <div class="section-label">今日能量</div>
  <div class="quote-card" id="quote-card"></div>

  <div class="update-ms-btn" onclick="toggleNotifPanel()" style="margin-top:16px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; background:var(--gray-card); border-radius:var(--radius); padding:14px; font-size:14px; color:var(--text-sub); border:none;">
    ⚙️ 提醒設定 ＆ 更新里程碑
  </div>

  <div class="reset-link" onclick="resetDay()">重置今天的打卡</div>
</div>

<script>
const TASKS = [
  { id:'en',     emoji:'🇬🇧', name:'英文練習',  min:'60 分鐘' },
  { id:'kr',     emoji:'🇰🇷', name:'韓文學習',  min:'45 分鐘' },
  { id:'study',  emoji:'📚', name:'學業作業',  min:'當天清零' },
  { id:'career', emoji:'🎯', name:'職涯發展',  min:'45 分鐘（選）' },
];
const MILESTONES = [
  { id:'toeic', emoji:'📝', label:'多益分數', unit:'分', base:478, target:900, color:'#378ADD' },
  { id:'topik', emoji:'🇰🇷', label:'TOPIK 級數', unit:'級', base:1, target:5, color:'#7F77DD' },
  { id:'port',  emoji:'📁', label:'企劃書',    unit:'份', base:0, target:5, color:'#BA7517' },
];
const QUOTES = [
  '站上和 MINGYU、S.COUPS 一樣的舞台，從今天這 2.5 小時開始。',
  '今天的 45 分鐘韓文，是未來在 HYBE 面試時的底氣。',
  'ENTP 的超能力是爆發力，你只需要啟動。',
  '多益 478 → 900 的距離，是一天一小時的距離。',
  '不需要完美的一天，只需要不放棄的一天。',
  '每一天的連續，是你和夢想之間縮短的距離。',
  'S.COUPS 說過：努力不會背叛你。你也一樣。',
];

function store() {
  try { return JSON.parse(localStorage.getItem('entp_v2') || '{}'); } catch(e) { return {}; }
}
function save(d) { try { localStorage.setItem('entp_v2', JSON.stringify(d)); } catch(e) {} }

function todayKey() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function init() {
  const days = ['日','一','二','三','四','五','六'];
  const d = new Date();
  document.getElementById('date-label').textContent =
    (d.getMonth()+1)+'月'+d.getDate()+'日 週'+days[d.getDay()];
  renderTasks(); renderMilestones(); renderHeatmap(); updateStreak(); renderQuote();
  initNotifUI();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  scheduleLocalCheck();
}

function renderTasks() {
  const s = store(); const today = s[todayKey()] || {};
  const grid = document.getElementById('tasks-grid');
  grid.innerHTML = '';
  TASKS.forEach(t => {
    const done = !!today[t.id];
    const card = document.createElement('div');
    card.className = 'task-card' + (done ? ' done' : '');
    card.innerHTML = `
      <div class="task-top">
        <span class="task-emoji">${t.emoji}</span>
        <div class="check">${done ? '✓' : ''}</div>
      </div>
      <div class="task-name">${t.name}</div>
      <div class="task-min">${t.min}</div>`;
    card.onclick = () => toggle(t.id);
    grid.appendChild(card);
  });
  updateProg();
}

function toggle(id) {
  const s = store(); const key = todayKey();
  if (!s[key]) s[key] = {};
  s[key][id] = !s[key][id];
  save(s); renderTasks(); renderHeatmap(); updateStreak(); renderQuote();
}

function updateProg() {
  const s = store(); const today = s[todayKey()] || {};
  const req = ['en','kr','study'];
  const done = req.filter(id => today[id]).length;
  const pct = Math.round(done / req.length * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
}

function updateStreak() {
  const s = store();
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    const day = s[key] || {};
    if (['en','kr','study'].every(id => day[id])) {
      streak++; d.setDate(d.getDate()-1);
    } else if (i === 0) { d.setDate(d.getDate()-1); }
    else break;
  }
  document.getElementById('streak-num').textContent = streak;
  const msgs = [
    ['連續天數', '完成3項後開始累積'],
    ['天 — 開始了！', '達到7天解鎖週成就'],
    ['天 — 真的在做了', '達到30天你就是不一樣的人'],
    ['天 — ENTP 奇蹟', '你打破了自己的天花板'],
  ];
  const idx = streak === 0 ? 0 : streak < 7 ? 1 : streak < 30 ? 2 : 3;
  document.getElementById('streak-label').textContent = streak === 0 ? msgs[0][0] : streak + msgs[idx][0];
  document.getElementById('streak-sub').textContent = msgs[idx][1];
}

function renderMilestones() {
  const s = store(); const ms = s.milestones || {};
  const row = document.getElementById('milestone-row');
  row.innerHTML = '';
  MILESTONES.forEach(m => {
    const cur = ms[m.id] !== undefined ? ms[m.id] : m.base;
    const range = m.target - m.base;
    const pct = range > 0 ? Math.min(100, Math.max(2, Math.round((cur - m.base) / range * 100))) : 2;
    const card = document.createElement('div');
    card.className = 'm-card';
    card.innerHTML = `
      <div class="m-icon">${m.emoji}</div>
      <div class="m-info">
        <div class="m-label">${m.label}</div>
        <div class="m-val" style="color:${m.color}">${cur} ${m.unit}</div>
        <div class="m-target">目標 ${m.target} ${m.unit}</div>
        <div class="m-bar-bg"><div class="m-bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
      </div>`;
    row.appendChild(card);
  });
  const s2 = store(); const ms2 = s2.milestones || {};
  document.getElementById('ms-toeic').value = ms2.toeic || 478;
  document.getElementById('ms-topik').value = ms2.topik || 1;
  document.getElementById('ms-port').value = ms2.port || 0;
}

function saveMilestones() {
  const s = store();
  s.milestones = {
    toeic: parseInt(document.getElementById('ms-toeic').value) || 478,
    topik: parseInt(document.getElementById('ms-topik').value) || 1,
    port: parseInt(document.getElementById('ms-port').value) || 0,
  };
  save(s); renderMilestones();
  document.getElementById('notif-panel').classList.remove('open');
  alert('里程碑已更新！');
}

function renderHeatmap() {
  const s = store();
  const wrap = document.getElementById('heatmap');
  wrap.innerHTML = '';
  const today = new Date();
  for (let i = 27; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    const day = s[key] || {};
    const count = ['en','kr','study','career'].filter(id => day[id]).length;
    const cell = document.createElement('div');
    cell.className = 'h-cell' + (count===1?' l1':count===2?' l2':count===3?' l3':count>=4?' l4':'');
    cell.textContent = d.getDate();
    wrap.appendChild(cell);
  }
}

function renderQuote() {
  const s = store(); const today = s[todayKey()] || {};
  const done = ['en','kr','study','career'].filter(id=>today[id]).length;
  const idx = (done + new Date().getDate()) % QUOTES.length;
  document.getElementById('quote-card').textContent = QUOTES[idx];
}

function toggleNotifPanel() {
  document.getElementById('notif-panel').classList.toggle('open');
}

function initNotifUI() {
  const s = store();
  const on = !!s.notif_on;
  const time = s.notif_time || '20:00';
  document.getElementById('notif-toggle').className = 'toggle' + (on ? ' on' : '');
  document.getElementById('notif-status').textContent = on ? '已開啟' : '已關閉';
  document.getElementById('notif-time').value = time;
  document.getElementById('notif-dot').className = 'notif-dot' + (on ? ' show' : '');
}

function toggleNotif() {
  const s = store();
  s.notif_on = !s.notif_on;
  save(s); initNotifUI();
}

function saveNotif() {
  const s = store();
  s.notif_time = document.getElementById('notif-time').value;
  save(s); initNotifUI();

  if (s.notif_on && 'Notification' in window) {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        document.getElementById('notif-panel').classList.remove('open');
        alert('提醒已設定！每天 ' + s.notif_time + ' 會提醒你打卡。\n\n請確保瀏覽器在背景執行才能收到通知。');
      } else {
        alert('請允許通知權限才能收到每日提醒。\n\n設定 > Safari > 通知 > 允許');
      }
    });
  } else {
    document.getElementById('notif-panel').classList.remove('open');
    alert('設定已儲存！開啟通知後才會收到提醒。');
  }
}

function scheduleLocalCheck() {
  setInterval(() => {
    const s = store();
    if (!s.notif_on || !s.notif_time) return;
    const now = new Date();
    const [h, m] = s.notif_time.split(':').map(Number);
    if (now.getHours() === h && now.getMinutes() === m) {
      const today = s[todayKey()] || {};
      const done = ['en','kr','study'].filter(id => today[id]).length;
      if (done < 3 && 'Notification' in window && Notification.permission === 'granted') {
        const lastKey = 'notif_last_' + todayKey();
        if (!s[lastKey]) {
          s[lastKey] = true; save(s);
          new Notification('每日打卡提醒 🔔', {
            body: `今天還有 ${3-done} 項任務未完成，加油！`,
            icon: './icon-192.png'
          });
        }
      }
    }
  }, 60000);
}

function resetDay() {
  if (!confirm('確定重置今天的打卡紀錄？')) return;
  const s = store(); s[todayKey()] = {}; save(s);
  renderTasks(); renderHeatmap(); updateStreak(); renderQuote();
}

init();
</script>
</body>
</html>
